<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Möbius Laundromat Seed</title>
<style>
html,body{margin:0;height:100%;background:#050508;color:#ddd;font-family:monospace;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#label{position:fixed;left:12px;top:10px;background:rgba(0,0,0,.45);padding:8px 10px;border:1px solid #555}
</style>
</head>
<body>
<div id="label">mini_mobius_laundromat — seed demo</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2');
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',resize);resize();
const vert=`#version 300 es
precision highp float;
out vec2 vUv;
const vec2 p[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3));
void main(){vUv=p[gl_VertexID]*.5+.5;gl_Position=vec4(p[gl_VertexID],0,1);}
`;
const frag=`#version 300 es
precision highp float;
out vec4 outColor; in vec2 vUv;
uniform vec2 uResolution; uniform float uTime; uniform vec2 uMouse;
float box(vec3 p, vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 mobius(vec3 p){
  float turn = 3.14159 * floor((p.z+4.0)/4.0);
  p.xy *= rot(turn*.5 + .3*sin(uTime*.2));
  p.z = mod(p.z+4.0,8.0)-4.0;
  return p;
}
float map(vec3 p){
  vec3 q=mobius(p);
  float room=max(abs(q.x)-2.2, max(abs(q.y)-1.4, abs(q.z)-3.8));
  float shell=abs(room)-.04;
  float washer=length(vec2(abs(q.x)-1.65,q.y+.15))-.42;
  washer=max(washer,abs(q.z-mod(q.z+1.0,1.4)+.7)-.12);
  float floor=q.y+1.4;
  return min(shell,min(washer,floor));
}
vec3 norm(vec3 p){vec2 e=vec2(.001,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
void main(){
  vec2 uv=(gl_FragCoord.xy*2.-uResolution.xy)/uResolution.y;
  vec3 ro=vec3(0,0.2,3.5+sin(uTime*.2));
  vec3 ta=vec3(0,0,-2);
  float yaw=(uMouse.x/uResolution.x-.5)*2.0;
  ro.xz*=rot(yaw);
  vec3 ww=normalize(ta-ro), uu=normalize(cross(vec3(0,1,0),ww)), vv=cross(ww,uu);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.7*ww);
  float t=0.; int steps=0;
  for(int i=0;i<120;i++){steps=i; float d=map(ro+rd*t); if(d<.001||t>30.)break; t+=d*.75;}
  vec3 col=vec3(.02,.018,.04);
  if(t<30.){
    vec3 p=ro+rd*t; vec3 n=norm(p); vec3 l=normalize(vec3(.4,.8,.2));
    float diff=max(dot(n,l),0.);
    float rim=pow(1.-abs(dot(n,-rd)),3.);
    col=vec3(.18,.16,.22)+diff*vec3(.7,.65,.9)+rim*vec3(.2,.9,1.0);
    col+=.08*sin(p.z*20.+uTime);
  }
  float fog=1.-exp(-.035*t*t);
  col=mix(col,vec3(.08,.06,.12),fog);
  outColor=vec4(pow(col,vec3(.4545)),1);
}`;
function compile(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
let pr=gl.createProgram();gl.attachShader(pr,compile(gl.VERTEX_SHADER,vert));gl.attachShader(pr,compile(gl.FRAGMENT_SHADER,frag));gl.linkProgram(pr);gl.useProgram(pr);
let mouse=[0,0];addEventListener('mousemove',e=>mouse=[e.clientX*devicePixelRatio,(innerHeight-e.clientY)*devicePixelRatio]);
function frame(ms){
 gl.useProgram(pr);
 gl.uniform2f(gl.getUniformLocation(pr,'uResolution'),canvas.width,canvas.height);
 gl.uniform1f(gl.getUniformLocation(pr,'uTime'),ms*.001);
 gl.uniform2f(gl.getUniformLocation(pr,'uMouse'),mouse[0],mouse[1]);
 gl.drawArrays(gl.TRIANGLES,0,3); requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script>
</body>
</html>
